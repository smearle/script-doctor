<!-- ===== Synthesized-games browser (extension) ===== -->
<style>
  #synthPanel{position:fixed;top:0;left:0;height:100%;width:340px;z-index:9999;
    background:#1b1b1b;border-right:2px solid #444;box-shadow:3px 0 12px rgba(0,0,0,.6);
    display:none;flex-direction:column;font-family:"Courier New",monospace;color:#ddd}
  #synthPanel.open{display:flex}
  #synthPanel .hd{padding:10px 12px;border-bottom:1px solid #333;display:flex;align-items:center;gap:8px}
  #synthPanel .hd b{color:#7cf;flex:1;font-size:14px}
  #synthPanel .hd a{color:#aaa;cursor:pointer;text-decoration:none;font-size:18px}
  #synthPanel input,#synthPanel select{width:100%;box-sizing:border-box;margin:3px 12px;
    width:calc(100% - 24px);background:#262626;color:#ddd;border:1px solid #444;padding:5px;font-family:inherit}
  #synthCount{font-size:11px;color:#888;padding:2px 12px}
  #synthList{flex:1;overflow-y:auto}
  #synthList .it{padding:6px 12px;cursor:pointer;border-bottom:1px solid #242424;font-size:12px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #synthList .it:hover{background:#2a3a4a;color:#cef}
  #synthList .bdg{font-size:9px;padding:1px 4px;border-radius:3px;margin-right:5px}
  #synthList .gp{background:#3a3a55;color:#bbf} #synthList .llm{background:#553a3a;color:#fbb}
  #synthList .solv{background:#2a5a2a;color:#bfb}
  #synthFab{position:fixed;left:12px;bottom:12px;z-index:9998;background:#2a3a4a;color:#cef;
    border:1px solid #567;border-radius:6px;padding:8px 12px;cursor:pointer;font-family:"Courier New",monospace}
</style>
<div id="synthFab" onclick="synthToggle(true)">🎲 synth games</div>
<div id="synthPanel">
  <div class="hd"><b>Synthesized games</b><a onclick="synthToggle(false)" title="close">✕</a></div>
  <select id="synthDataset">
    <option value="/game_synth/dataset/viewer_index.json">Main dataset (1000, deduped)</option>
    <option value="/game_synth/coevolve_pool/viewer_index.json">Co-evolution pool (220)</option>
    <option value="/game_synth/gated_loss2/viewer_index.json">Evolve: gated_loss2 (plain-loss, det, non-trivial, LIVE)</option>
    <option value="/game_synth/gated_progress2/viewer_index.json">Evolve: gated_progress2 (Δloss, det, non-trivial, LIVE)</option>
    <option value="/game_synth/gated_loss/viewer_index.json">Evolve: gated_loss (plain-loss, det, non-trivial)</option>
    <option value="/game_synth/gated_progress/viewer_index.json">Evolve: gated_progress (Δloss, det, non-trivial)</option>
    <option value="/game_synth/big_loss_norand/viewer_index.json">Evolve: big_loss (plain-loss, cap8, NO random)</option>
    <option value="/game_synth/big_progress_norand/viewer_index.json">Evolve: big_progress (Δloss, cap8, NO random)</option>
    <option value="/game_synth/big_loss/viewer_index.json">Evolve: big_loss (plain-loss, cap8, +random)</option>
    <option value="/game_synth/big_progress/viewer_index.json">Evolve: big_progress (Δloss, cap8, +random)</option>
    <option value="/game_synth/evolve_lossw0/viewer_index.json">Evolve: lossw0 (plain-loss, cap4)</option>
  </select>
  <input id="synthSearch" placeholder="search title…" autocomplete="off">
  <select id="synthFilter">
    <option value="all">all sources</option>
    <option value="gp">GP (search-validated)</option>
    <option value="llm">LLM (ELM)</option>
    <option value="solv">solvable-tagged</option>
  </select>
  <select id="synthSort">
    <option value="recency">sort: recency (newest first)</option>
    <option value="gen">sort: generation (newest first)</option>
    <option value="fitness">sort: fitness (WM loss, high first)</option>
    <option value="mechanics">sort: activated mechanics (most first)</option>
    <option value="states">sort: state-space size (largest first)</option>
    <option value="none">sort: index order</option>
  </select>
  <label style="display:block;font-size:11px;color:#aaa;padding:2px 12px"><input type="checkbox" id="synthHideTrivial" style="width:auto;margin:0 6px 0 0">hide trivial (winnable in &le;1 step)</label>
  <div id="synthCount"></div>
  <div id="synthList"></div>
</div>
<script>
(function(){
  var GAMES=[];
  function synthLoad(g){
    fetch(g.file).then(function(r){return r.text();}).then(function(code){
      // canonical editor load sequence (cf editor.js tryLoadGist) -> full input/play works
      editor.setValue(code); editor.clearHistory();
      if(typeof clearConsole==="function") clearConsole();
      if(typeof setEditorClean==="function") setEditorClean();
      if(typeof unloadGame==="function") unloadGame();
      compile(["restart"], code);
      synthToggle(false);
      try{ document.getElementById("gameCanvas").focus(); }catch(e){}
    }).catch(function(e){ if(typeof consoleError==="function") consoleError("load failed: "+e); });
  }
  function visible(){
    var q=document.getElementById("synthSearch").value.toLowerCase();
    var f=document.getElementById("synthFilter").value;
    var s=document.getElementById("synthSort").value;
    var hideTrivial=document.getElementById("synthHideTrivial").checked;
    var v=GAMES.filter(function(g){
      if(hideTrivial && g.sol_len!=null && g.sol_len>=0 && g.sol_len<=1) return false;
      return (f==="all"||g.source===f||(f==="solv"&&g.solvable)) &&
             (!q||g.title.toLowerCase().indexOf(q)>=0); });
    var key={recency:"recency",gen:"gen",fitness:"fitness",mechanics:"mechanics",states:"states"}[s];
    if(key){ v=v.slice().sort(function(a,b){
      var av=a[key], bv=b[key];
      av=(av==null?-Infinity:av); bv=(bv==null?-Infinity:bv);
      return bv-av; }); }
    return v;
  }
  function render(){
    var v=visible();
    document.getElementById("synthCount").textContent=v.length+" / "+GAMES.length+" games";
    var list=document.getElementById("synthList"); list.innerHTML="";
    var frag=document.createDocumentFragment();
    v.slice(0,800).forEach(function(g){
      var d=document.createElement("div"); d.className="it";
      d.innerHTML='<span class="bdg '+g.source+'">'+g.source+'</span>'+
                  (g.solvable?'<span class="bdg solv">✓'+(g.sol_len!=null&&g.sol_len>=0?g.sol_len:'')+'</span>':'')+
                  (g.gen!=null?'<span class="bdg" style="background:#334;color:#9cf">g'+g.gen+'</span>':'')+
                  (g.mechanics!=null?'<span class="bdg" style="background:#444;color:#cc9">'+g.mechanics+'m</span>':'')+
                  (g.fitness!=null?'<span class="bdg" style="background:#353;color:#9c9">'+g.fitness.toFixed(1)+'</span>':'')+
                  g.title.replace(/</g,"&lt;");
      d.onclick=function(){ synthLoad(g); };
      frag.appendChild(d);
    });
    list.appendChild(frag);
    if(v.length>800){ var m=document.createElement("div"); m.className="it"; m.style.color="#666";
      m.textContent="… "+(v.length-800)+" more (refine search)"; list.appendChild(m); }
  }
  window.synthToggle=function(open){
    document.getElementById("synthPanel").classList.toggle("open", open!==false ? !!open : false);
    if(open){ document.getElementById("synthSearch").focus(); }
  };
  var link=document.getElementById("synthGamesLink");
  if(link) link.onclick=function(){ synthToggle(true); };
  function loadIndex(){
    var url=document.getElementById("synthDataset").value;
    document.getElementById("synthCount").textContent="loading…";
    fetch(url).then(function(r){return r.json();})
      .then(function(g){ GAMES=g; render(); })
      .catch(function(e){ document.getElementById("synthCount").textContent="index load failed: "+e; });
  }
  loadIndex();
  document.getElementById("synthDataset").onchange=loadIndex;
  document.getElementById("synthSearch").oninput=render;
  document.getElementById("synthFilter").onchange=render;
  document.getElementById("synthSort").onchange=render;
  document.getElementById("synthHideTrivial").onchange=render;
})();
</script>
